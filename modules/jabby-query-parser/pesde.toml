name = "alicesaidhi/jabby_query_parser"
version = "0.1.0"
includes = ["src/*", "pesde.toml"]
license = "MIT"

[target]
environment = "roblox"
lib = "src/lib.luau"
build_files = ["src"]

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[indices]
default = "https://github.com/daimond113/pesde-index"

[dev_dependencies]
jest = { wally = "jsdotlua/jest", version = "^3.10.0" }
jest_globals = { wally = "jsdotlua/jest-globals", version = "^3.10.0" }
gt = { name = "corecii/greentea", version = "^0.4.11" }

[dependencies]